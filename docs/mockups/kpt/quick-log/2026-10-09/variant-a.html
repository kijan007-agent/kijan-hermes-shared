<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A — One-Tap Speed</title>
<style>
  :root{ --bg:#FAFAF8; --surface:#FFFFFF; --ink:#2C3E50; --muted:#5D6D7E; --line:#E8E6E1; --primary:#2B6A4F; --primary-soft:#D9EDE4; --primary-deep:#1B4332; --accent:#E07A5F; --accent-soft:#F8DCD3; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,Segoe UI,system-ui,sans-serif;height:100vh;overflow:hidden}
  .top{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
  .day{font-weight:600;font-size:15px}
  .pill{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-deep)}
  .greet{padding:0 16px 6px;color:var(--muted);font-size:13px}
  h1{margin:0 16px 14px;font-size:22px;letter-spacing:-0.01em}
  .card{margin:8px 14px;padding:14px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .card .lbl{font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;gap:8px;margin-top:10px}
  .mood{flex:1;padding:14px 0;text-align:center;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;min-height:56px;cursor:pointer}
  .mood.sel{background:var(--primary-soft);border-color:var(--primary)}
  .mood .lab{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .mood.sel .lab{color:var(--primary-deep);font-weight:600}
  .qck{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .qck .pill2{padding:10px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;min-height:40px}
  .qck .pill2.sel{background:var(--accent-soft);border-color:var(--accent)}
  .qck .pill2.add{border-style:dashed;color:var(--muted)}
  .strip{margin:10px 14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .strip .txt{flex:1;font-size:13px;color:var(--muted)}
  .strip .txt b{color:var(--ink)}
  .fabwrap{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:14px;color:var(--muted);font-size:12px}
  .fab{padding:18px 26px;border-radius:999px;background:var(--primary);color:#fff;border:0;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(43,106,79,0.28);cursor:pointer;min-height:56px}
  .fab:active{transform:translateY(1px)}
  /* F-05: non-actionable confirmation pill replaces the removed FAB. */
  .fabdone{padding:14px 24px;border-radius:999px;background:var(--primary-soft);color:var(--primary-deep);font-weight:600;font-size:14px;letter-spacing:0.01em}
  .toast{position:absolute;left:14px;right:14px;bottom:90px;background:var(--primary-deep);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  /* F-04: visually-hidden mirror of mood state for screen-reader announcement */
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .x{position:absolute;top:14px;left:14px;width:24px;height:24px;border-radius:8px;background:#000;color:#fff;text-align:center;line-height:24px;font-size:12px}
  /* F-01 (WCAG 2.4.7) — global :focus-visible ring on all <button> elements */
  button:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
  .mood:focus-visible{outline:3px solid var(--primary-deep);outline-offset:3px}
  /* F-02 (WCAG 2.3.3) — honour reduced-motion: drop all motion + transitions */
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
    .toast{transition:none!important}
    .fab:active{transform:none!important}
  }
</style></head>
<body>
  <div class="top"><div class="day">Today · Thu</div><div class="pill">No streak</div></div>
  <div class="greet">Good morning. No pressure — one tap is enough.</div>
  <h1>How are you?</h1>

  <div class="card">
    <div class="lbl">MoodQuickButton — single tap</div>
    <!-- F-06: unified 5-point face scale (rough / low / ok / good / great). Same set used in B, C and About-You. -->
    <!-- F-04: aria-pressed reflects selection state for assistive tech. -->
    <div class="row" id="moods" role="radiogroup" aria-label="How are you feeling?">
      <button type="button" class="mood" data-mood="1" role="radio" aria-checked="false" aria-label="rough">😣<span class="lab">rough</span></button>
      <button type="button" class="mood" data-mood="2" role="radio" aria-checked="false" aria-label="low">😕<span class="lab">low</span></button>
      <button type="button" class="mood" data-mood="3" role="radio" aria-checked="false" aria-label="ok">😐<span class="lab">ok</span></button>
      <button type="button" class="mood" data-mood="4" role="radio" aria-checked="false" aria-label="good">🙂<span class="lab">good</span></button>
      <button type="button" class="mood" data-mood="5" role="radio" aria-checked="false" aria-label="great">😊<span class="lab">great</span></button>
    </div>
    <!-- F-04: live region for assistive-tech confirmation of mood logging. -->
    <div id="mood-live" aria-live="polite" class="sr"></div>
  </div>

  <div class="card">
    <div class="lbl">SymptomQuickAdd — recent</div>
    <div class="qck" id="sym">
      <button class="pill2 sel">Fatigue</button>
      <button class="pill2">Brain fog</button>
      <button class="pill2">Headache</button>
      <button class="pill2">Pain</button>
      <button class="pill2 add">＋ Symptom</button>
    </div>
  </div>

  <div class="strip"><span class="dot"></span><span class="txt"><b>Logged:</b> Mood (low) · Fatigue · 2 taps. Saved at 08:42.</span></div>

  <div class="fabwrap">
    <div>Long-press any tile to fine-tune later.</div>
    <!-- F-05: removed "Save & close" FAB — one-tap promise: selection on Home already auto-saves. -->
    <div class="fabdone" role="status">All done ✓</div>
  </div>

  <div class="toast">Saved · no need to do anything else today.</div>

  <!-- F-04: mood buttons wired with selection toggle + toast + POST to API. -->
  <!-- F-03 (B/C analogue): single-tap selection auto-saves — no "Next" gate. -->
  <script>
  (function () {
    'use strict';
    var MOOD_LABELS = { 1:'rough', 2:'low', 3:'ok', 4:'good', 5:'great' };
    var STORAGE_KEY = 'kpt.quicklog.mood';
    var toast  = document.querySelector('.toast');
    var live   = document.getElementById('mood-live');
    var strip  = document.querySelector('.strip .txt');
    var stripHtml = strip ? strip.innerHTML : '';
    var group  = document.getElementById('moods');
    var buttons = group ? group.querySelectorAll('.mood') : [];
    var selected = null;

    function showToast(msg) {
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    function updateStrip(mood) {
      if (!strip) return;
      var label = MOOD_LABELS[mood] || '—';
      strip.innerHTML = '<b>Logged:</b> Mood (' + label + '). Saved just now.';
    }

    function persistLocal(mood) {
      try {
        var payload = { mood: mood, label: MOOD_LABELS[mood], at: new Date().toISOString() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) { /* localStorage may be unavailable; non-fatal */ }
    }

    function postMood(mood) {
      // TODO(api): endpoint not yet finalised — see t_f91cdd18-followup-api.
      // Expected contract: POST /api/quick-log/mood  body: { mood: 1..5, at: ISO8601 }.
      // Until the backend lands, this call is intentionally a no-op so the UI stays testable.
      if (typeof fetch !== 'function') return;
      var body = JSON.stringify({ mood: mood, at: new Date().toISOString() });
      try {
        fetch('/api/quick-log/mood', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body,
          keepalive: true
        }).catch(function () { /* network failure is non-blocking; localStorage is the source of truth */ });
      } catch (e) { /* same — never block the UI on a failed POST */ }
    }

    function selectMood(btn) {
      var mood = parseInt(btn.getAttribute('data-mood'), 10);
      if (!mood) return;

      // F-04 — toggle: re-tapping the same mood clears the selection (in case of misclick).
      if (selected === mood) {
        btn.classList.remove('sel');
        btn.setAttribute('aria-checked', 'false');
        selected = null;
        if (live) live.textContent = '';
        showToast('Selection cleared.');
        return;
      }

      // Single-tap auto-save: clear siblings, mark this one.
      buttons.forEach(function (b) {
        b.classList.remove('sel');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('sel');
      btn.setAttribute('aria-checked', 'true');
      selected = mood;

      var label = MOOD_LABELS[mood];
      if (live) live.textContent = 'Mood logged as ' + label + '.';
      showToast('Mood (' + label + ') saved.');
      updateStrip(mood);
      persistLocal(mood);
      postMood(mood);
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { selectMood(b); });
    });

    // Hydrate from a prior session — supports the "picked up where I left off" promise of variant A.
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var prior = JSON.parse(raw);
        if (prior && prior.mood && MOOD_LABELS[prior.mood]) {
          buttons.forEach(function (b) {
            if (parseInt(b.getAttribute('data-mood'), 10) === prior.mood) {
              b.classList.add('sel');
              b.setAttribute('aria-checked', 'true');
              selected = prior.mood;
              updateStrip(prior.mood);
            }
          });
        }
      }
    } catch (e) { /* corrupt payload — start fresh */ }
  })();
  </script>
</body></html>
