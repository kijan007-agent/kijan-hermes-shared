<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>C — Mini Sheet</title>
<style>
  :root{ --bg:#EEEBE4; --surface:#FFFFFF; --ink:#2C3E50; --muted:#5D6D7E; --line:#E4E0D6; --primary:#2B6A4F; --primary-soft:#D9EDE4; --primary-deep:#1B4332; --accent:#4A90A4; --accent-soft:#DCEBEF; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,Segoe UI,system-ui,sans-serif;height:100vh;display:flex;align-items:flex-end;overflow:hidden}
  .dim{position:absolute;inset:0;background:rgba(20,25,20,0.35)}
  .sheet{position:relative;width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px 18px;box-shadow:0 -8px 30px rgba(0,0,0,0.12)}
  .grab{width:44px;height:5px;border-radius:3px;background:#D6D2C6;margin:0 auto 12px}
  .ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .ttl h2{margin:0;font-size:17px}
  .ttl .x{width:30px;height:30px;border-radius:10px;background:#F1EEE6;border:0;font-size:16px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 8px}
  .sev{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sq{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:center;font-size:15px;cursor:pointer;min-height:52px}
  .sq.sel{background:var(--accent-soft);border-color:var(--accent)}
  .sq .s{display:block;font-size:10px;color:var(--muted)}
  .body{display:flex;gap:8px;justify-content:center}
  .bp{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .bp.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .note{width:100%;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;min-height:44px;background:#fff}
  .acts{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;padding:16px;border-radius:14px;border:0;font-size:15px;font-weight:600;cursor:pointer;min-height:52px}
  .btn.cancel{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .btn.save{background:var(--primary);color:#fff}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}
  /* F-01 (WCAG 2.4.7) — global :focus-visible ring on all <button> elements */
  button:focus-visible,.dim:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
  .sq:focus-visible,.bp:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
  .x:focus-visible{outline:3px solid var(--primary-deep);outline-offset:2px}
  /* F-02 (WCAG 2.3.3) — honour reduced-motion: drop all motion + transitions */
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style></head>
<body>
  <!-- F-07: dim layer is now an interactive close target (click + keyboard). -->
  <div class="dim" role="button" tabindex="0" aria-label="Close sheet" onclick="closeSheet()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();closeSheet()}"></div>
  <!-- F-07: dialog semantics — role, aria-modal, labelledby for screen-reader context. -->
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet">
    <div class="grab" aria-hidden="true"></div>
    <!-- F-07: close button now wired to closeSheet(); explicit aria-label; aria-controls references the dialog. -->
    <div class="ttl"><h2 id="sheet-title">Quick log</h2><button class="x" type="button" aria-label="Close sheet" aria-controls="sheet" onclick="closeSheet()">✕</button></div>

    <!-- F-06: unified 5-point face scale (rough / low / ok / good / great). Same scale used in A, B and About-You. -->
    <!-- F-04 (mini-sheet analogue): single-tap selection, optional. -->
    <div class="lbl">How do you feel?</div>
    <div class="body" id="mood-row" role="radiogroup" aria-label="How do you feel?">
      <button type="button" class="bp mood" data-mood="1" role="radio" aria-checked="false" aria-label="rough">😣<br><span style="font-size:9px">rough</span></button>
      <button type="button" class="bp mood" data-mood="2" role="radio" aria-checked="false" aria-label="low">😕<br><span style="font-size:9px">low</span></button>
      <button type="button" class="bp mood" data-mood="3" role="radio" aria-checked="false" aria-label="ok">😐<br><span style="font-size:9px">ok</span></button>
      <button type="button" class="bp mood" data-mood="4" role="radio" aria-checked="false" aria-label="good">🙂<br><span style="font-size:9px">good</span></button>
      <button type="button" class="bp mood" data-mood="5" role="radio" aria-checked="false" aria-label="great">😊<br><span style="font-size:9px">great</span></button>
    </div>

    <div class="lbl">Symptom</div>
    <div class="symlist" id="sym-row" style="display:flex;gap:8px;flex-wrap:wrap" role="group" aria-label="Symptom">
      <button type="button" class="sq" data-sym="fatigue">Fatigue</button>
      <button type="button" class="sq" data-sym="headache">Headache</button>
      <button type="button" class="sq" data-sym="pain">Pain</button>
    </div>

    <div class="lbl">How strong?</div>
    <div class="sev" role="radiogroup" aria-label="How strong?">
      <button type="button" class="sq" data-sev="0">○<span class="s">none</span></button>
      <button type="button" class="sq" data-sev="1">◔<span class="s">mild</span></button>
      <button type="button" class="sq" data-sev="2">◑<span class="s">medium</span></button>
      <button type="button" class="sq" data-sev="3">●<span class="s">severe</span></button>
    </div>

    <div class="lbl">Where? (optional)</div>
    <div class="body" id="body-row" role="group" aria-label="Where?">
      <button type="button" class="bp" data-bp="head">Head</button>
      <button type="button" class="bp" data-bp="arms">Arms</button>
      <button type="button" class="bp" data-bp="legs">Legs</button>
      <button type="button" class="bp" data-bp="chest">Chest</button>
    </div>

    <input class="note" id="note" placeholder="Note (optional)">

    <div class="acts">
      <button class="btn cancel" type="button" id="btn-cancel">Cancel</button>
      <button class="btn save" type="button" id="btn-save">Save symptom</button>
    </div>
    <div class="hint">Saved instantly — no confirmation needed.</div>
  </div>
  <!-- F-07: close handlers (ESC, dim-click, ✕) + focus trap inside the dialog. -->
  <script>
    (function(){
      var sheet = document.getElementById('sheet');
      var dim   = document.querySelector('.dim');
      var firstFocusable = sheet.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');

      function focusableInSheet(){
        return Array.prototype.slice.call(
          sheet.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')
        ).filter(function(el){ return el.offsetParent !== null || el === document.activeElement; });
      }

      window.closeSheet = function(){
        // Static mockup — no parent to return to, so we hide the dim + sheet and
        // move focus back to the dim layer so keyboard users keep context.
        dim.style.display = 'none';
        sheet.style.display = 'none';
        try { dim.focus(); } catch(_) {}
      };

      // F-04 (mini-sheet analogue): wire every control group. Save persists + closes.
      // F-03: Save is gated when required (mood + symptom + severity).
      function bindRadiogroup(sel, onSelect) {
        var btns = document.querySelectorAll(sel);
        btns.forEach(function(b){
          b.addEventListener('click', function(){
            btns.forEach(function(o){ o.classList.remove('sel'); o.setAttribute('aria-checked','false'); });
            b.classList.add('sel');
            b.setAttribute('aria-checked','true');
            onSelect(b);
          });
        });
      }
      function bindMultiselect(sel, onToggle) {
        var btns = document.querySelectorAll(sel);
        btns.forEach(function(b){
          b.addEventListener('click', function(){
            var pressed = b.getAttribute('aria-pressed') === 'true';
            if (pressed) { b.classList.remove('sel'); b.setAttribute('aria-pressed','false'); }
            else         { b.classList.add('sel');    b.setAttribute('aria-pressed','true');  }
            onToggle(b, !pressed);
          });
        });
      }

      var selection = { mood:null, symptom:null, symptoms:[], severity:null, body:null, note:'' };
      var saveBtn = document.getElementById('btn-save');
      var cancelBtn = document.getElementById('btn-cancel');

      function refreshSaveEnabled(){
        // Required: at least one of (mood | symptom) must be set. Severity required only if symptom set.
        var hasMood = !!selection.mood;
        var hasSym  = selection.symptoms.length > 0;
        var needsSeverity = hasSym && selection.severity === null;
        saveBtn.disabled = !(hasMood || hasSym) || needsSeverity;
      }

      // F-06: mood row uses the unified scale.
      bindRadiogroup('#mood-row .mood', function(b){ selection.mood = parseInt(b.getAttribute('data-mood'),10); refreshSaveEnabled(); });
      bindRadiogroup('#sym-row .sq',    function(b){ selection.symptom = b.getAttribute('data-sym'); refreshSaveEnabled(); });
      bindRadiogroup('.sev .sq',        function(b){ selection.severity = parseInt(b.getAttribute('data-sev'),10); refreshSaveEnabled(); });
      bindMultiselect('#body-row .bp',  function(b, on){ selection.body = on ? b.getAttribute('data-bp') : null; });

      document.getElementById('note').addEventListener('input', function(e){ selection.note = e.target.value; });

      function persist() {
        try { localStorage.setItem('kpt.quicklog.sheet', JSON.stringify(selection)); } catch(_) {}
        // TODO(api): POST /api/quick-log/sheet — not yet finalised; see t_f91cdd18-followup-api.
        // Intentionally a no-op until the backend lands; UI behaviour is fully exercised without it.
      }

      saveBtn.addEventListener('click', function(){
        if (saveBtn.disabled) return;
        persist();
        closeSheet();
      });
      cancelBtn.addEventListener('click', closeSheet);

      refreshSaveEnabled();

      // ESC closes the sheet.
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' || e.key === 'Esc') {
          e.preventDefault();
          window.closeSheet();
        }
        // Fokus-Trap: Tab/Shift+Tab zyklisch innerhalb des Sheets.
        if (e.key === 'Tab' && sheet.style.display !== 'none') {
          var items = focusableInSheet();
          if (items.length === 0) return;
          var first = items[0];
          var last  = items[items.length - 1];
          var active = document.activeElement;
          if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
        }
      });

      // Init: move initial focus into the dialog (close button is a sensible anchor).
      window.addEventListener('DOMContentLoaded', function(){
        if (firstFocusable) firstFocusable.focus();
      });
    })();
  </script>
</body></html>
