<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Variant 2 — Stacked Diff</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; background: #1a1a1a; padding: 24px; }
.label-tag { color: #A0A0A0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; padding-left: 4px; }
.phone {
  width: 375px; height: 760px; margin: 0 auto;
  background: #121212; border-radius: 32px;
  padding: 22px 20px; border: 1px solid #2a2a2a;
  display: flex; flex-direction: column; gap: 12px;
}
h1 { color: #E0E0E0; font-size: 20px; font-weight: 600; }
.subtitle { color: #A0A0A0; font-size: 13px; }
.period-tabs { display: flex; gap: 6px; }
.period-tabs button {
  flex: 1; height: 36px; background: transparent; border: 1px solid #333;
  border-radius: 8px; color: #A0A0A0; font-size: 12px;
}
.period-tabs .active { background: #5C9BFF22; border-color: #5C9BFF; color: #5C9BFF; }
.metric {
  background: #1E1E1E; border-radius: 14px; padding: 14px;
  border: 1px solid #2a2a2a;
}
.metric-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.metric-label { color: #A0A0A0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.diff-pill { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.diff-up { background: #FFB74D22; color: #FFB74D; }
.diff-down { background: #4CAF5022; color: #4CAF50; }
.diff-warn { background: #FF6B6B22; color: #FF6B6B; }
.diff-stack { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #E0E0E0; }
.diff-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
.diff-row:last-child { border: 0; }
.diff-row .left { color: #A0A0A0; font-size: 12px; }
.diff-row .arrow { font-size: 11px; }
.arrow-up { color: #FFB74D; }
.arrow-down { color: #4CAF50; }
.arrow-warn { color: #FF6B6B; }
.risk-card { background: #1E1E1E; border-radius: 14px; padding: 14px; border: 1px solid #2a2a2a; }
.risk-bar { height: 8px; background: #2a2a2a; border-radius: 4px; margin-top: 8px; position: relative; overflow: hidden; }
.risk-bar-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #FFB74D 60%, #FF6B6B); width: 35%; }
.risk-caption { color: #FFB74D; font-size: 14px; font-weight: 600; margin-top: 8px; }
.btn {
  margin-top: auto; height: 52px; background: #5C9BFF; color: #121212;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
}
</style>
</head>
<body>
<div class="label-tag">Variant 2 · stacked diff · explicit deltas</div>
<div class="phone">
  <div>
    <h1>Double PEM</h1>
    <div class="subtitle">A: 28.09. → B: 27.09.</div>
  </div>
  <div class="period-tabs">
    <button class="active">Tag</button>
    <button>Woche</button>
    <button>Aktivität</button>
  </div>
  <div class="metric">
    <div class="metric-head">
      <span class="metric-label">PEM-Risiko</span>
      <span class="diff-pill diff-warn">+12</span>
    </div>
    <div class="risk-bar"><div class="risk-bar-fill"></div></div>
    <div class="risk-caption">● Leicht erhöht · A vs B</div>
  </div>
  <div class="metric">
    <div class="metric-head">
      <span class="metric-label">Vitalzeichen</span>
      <span class="diff-pill diff-up">Δ</span>
    </div>
    <div class="diff-stack">
      <div class="diff-row"><span class="left">HRV</span><span>42 ms <span class="arrow arrow-warn">↓12%</span></span></div>
      <div class="diff-row"><span class="left">Ruhepuls</span><span>72 <span class="arrow arrow-up">↑5</span></span></div>
      <div class="diff-row"><span class="left">Schritte</span><span>4 200 <span class="arrow arrow-warn">↑87%</span></span></div>
    </div>
  </div>
  <div class="metric">
    <div class="metric-head">
      <span class="metric-label">Symptome</span>
      <span class="diff-pill diff-down">Δ</span>
    </div>
    <div class="diff-stack">
      <div class="diff-row"><span class="left">Fatigue</span><span>4/10 <span class="arrow arrow-up">+1</span></span></div>
      <div class="diff-row"><span class="left">Brain Fog</span><span>3/10 <span class="arrow arrow-up">+1</span></span></div>
      <div class="diff-row"><span class="left">Schmerz</span><span>2/10 <span class="arrow arrow-down">−1</span></span></div>
    </div>
  </div>
  <button class="btn">Symptome erfassen</button>
</div>
</body>
</html>
